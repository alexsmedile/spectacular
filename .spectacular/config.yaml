project:
  name: spectacular
  summary: "AI-native operational workspace — directory convention, skill, and CLI bootstrap for software projects"

# Structural version of .spectacular/ layout. Migrations bump this.
# Run `spectacular migrate` if your skill expects a newer schema.
workspace_schema: "2.0"

# Provenance — which spectacular version scaffolded this workspace (write-once)
# and which last structurally touched it (bumped by migrate / doctor --fix).
# created_with is "unknown" here: this workspace predates provenance tracking.
created_with: "unknown"
last_touched_with: "1.30.0"

naming:
  requests: kebab-case
  prefix: ""

required_files:
  requests:
    - PLAN.md
    - TASKS.md

agents:
  file: AGENTS.md             # override to CLAUDE.md for Claude-only teams
  tool_overrides:             # per-tool agent files (read in addition to file: above)
    # claude: CLAUDE.md       # uncomment if AGENTS.md is primary but Claude also needs CLAUDE.md
  default_context:
    - PRD.md
    - STACK.md
    - DECISIONS.md

skills:
  symlink_on_init: []

# AFK Git policy is opt-in. Configure through `spectacular afk configure`.
# afk_git:
#   enabled: false
#   branch_prefix: "codex/"
#   primary_branches: "main,master,develop"
#   allow_pr_create: false

last_build: 41

afk_git:
  enabled: true
  branch_prefix: "codex/"
  primary_branches: "main,master,develop"
  allow_pr_create: true
