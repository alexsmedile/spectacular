<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="100%" height="100%" style="background:#0b0f17; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#112233" />
      <stop offset="100%" stop-color="#0a1520" />
    </linearGradient>

    <linearGradient id="cardSkill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241935" />
      <stop offset="100%" stop-color="#140d20" />
    </linearGradient>

    <linearGradient id="cardFs" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#102b23" />
      <stop offset="100%" stop-color="#091914" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Canvas -->
  <rect x="10" y="10" width="820" height="380" rx="16" fill="url(#bgGrad2)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header -->
  <text x="420" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#f8fafc" letter-spacing="0.5">THE SPECTACULAR DIVISION OF LABOR</text>
  <text x="420" y="64" text-anchor="middle" font-size="12" font-weight="400" fill="#94a3b8">Clean Separation of Invariants, Judgment, and Canonical State</text>

  <!-- 3 CARDS LAYOUT -->

  <!-- CARD 1: THE GO BINARY -->
  <g filter="url(#cardShadow)">
    <rect x="35" y="88" width="240" height="275" rx="12" fill="url(#cardGo)" stroke="#0ea5e9" stroke-width="1.5" />
    
    <!-- Badge -->
    <rect x="52" y="105" width="80" height="20" rx="10" fill="#0369a1" />
    <text x="92" y="119" text-anchor="middle" font-size="10" font-weight="700" fill="#e0f2fe" letter-spacing="0.5">MECHANICS</text>
    
    <!-- Title -->
    <text x="52" y="148" font-size="16" font-weight="700" fill="#38bdf8">The Go Binary</text>
    <text x="52" y="166" font-size="11" font-weight="500" fill="#94a3b8">Deterministic Invariants</text>
    
    <line x1="52" y1="180" x2="258" y2="180" stroke="#16384c" stroke-width="1" />
    
    <!-- Features -->
    <text x="52" y="204" font-size="12" font-weight="600" fill="#bae6fd">✓ Schema Invariants</text>
    <text x="64" y="219" font-size="10.5" font-weight="400" fill="#64748b">Hard validation rules</text>
    
    <text x="52" y="243" font-size="12" font-weight="600" fill="#bae6fd">✓ SHA-256 Fingerprints</text>
    <text x="64" y="258" font-size="10.5" font-weight="400" fill="#64748b">Prevents silent drift</text>
    
    <text x="52" y="282" font-size="12" font-weight="600" fill="#bae6fd">✓ Atomic Transitions</text>
    <text x="64" y="297" font-size="10.5" font-weight="400" fill="#64748b">Zero torn record states</text>

    <text x="52" y="321" font-size="12" font-weight="600" fill="#bae6fd">✓ JSON Projections</text>
    <text x="64" y="336" font-size="10.5" font-weight="400" fill="#64748b">Compact token savings</text>
  </g>

  <!-- CARD 2: THE SKILL -->
  <g filter="url(#cardShadow)">
    <rect x="300" y="88" width="240" height="275" rx="12" fill="url(#cardSkill)" stroke="#a855f7" stroke-width="1.5" />
    
    <!-- Badge -->
    <rect x="317" y="105" width="94" height="20" rx="10" fill="#7e22ce" />
    <text x="364" y="119" text-anchor="middle" font-size="10" font-weight="700" fill="#faf5ff" letter-spacing="0.5">INTELLIGENCE</text>
    
    <!-- Title -->
    <text x="317" y="148" font-size="16" font-weight="700" fill="#c084fc">The Skill</text>
    <text x="317" y="166" font-size="11" font-weight="500" fill="#94a3b8">Judgment &amp; Orchestration</text>
    
    <line x1="317" y1="180" x2="523" y2="180" stroke="#3b1f5c" stroke-width="1" />
    
    <!-- Features -->
    <text x="317" y="204" font-size="12" font-weight="600" fill="#e9d5ff">✓ Request Translation</text>
    <text x="329" y="219" font-size="10.5" font-weight="400" fill="#64748b">Turns needs into plans</text>
    
    <text x="317" y="243" font-size="12" font-weight="600" fill="#e9d5ff">✓ Contextual Judgment</text>
    <text x="329" y="258" font-size="10.5" font-weight="400" fill="#64748b">Solves complex problems</text>
    
    <text x="317" y="282" font-size="12" font-weight="600" fill="#e9d5ff">✓ Human Interaction</text>
    <text x="329" y="297" font-size="10.5" font-weight="400" fill="#64748b">Batch gates &amp; authority</text>

    <text x="317" y="321" font-size="12" font-weight="600" fill="#e9d5ff">✓ Git Ops Orchestration</text>
    <text x="329" y="336" font-size="10.5" font-weight="400" fill="#64748b">Branch &amp; worktree flow</text>
  </g>

  <!-- CARD 3: THE FILESYSTEM -->
  <g filter="url(#cardShadow)">
    <rect x="565" y="88" width="240" height="275" rx="12" fill="url(#cardFs)" stroke="#10b981" stroke-width="1.5" />
    
    <!-- Badge -->
    <rect x="582" y="105" width="82" height="20" rx="10" fill="#047857" />
    <text x="623" y="119" text-anchor="middle" font-size="10" font-weight="700" fill="#ecfdf5" letter-spacing="0.5">SUBSTRATE</text>
    
    <!-- Title -->
    <text x="582" y="148" font-size="16" font-weight="700" fill="#34d399">The Filesystem</text>
    <text x="582" y="166" font-size="11" font-weight="500" fill="#94a3b8">Canonical Markdown Truth</text>
    
    <line x1="582" y1="180" x2="788" y2="180" stroke="#144436" stroke-width="1" />
    
    <!-- Features -->
    <text x="582" y="204" font-size="12" font-weight="600" fill="#a7f3d0">✓ Zero Hidden Daemons</text>
    <text x="594" y="219" font-size="10.5" font-weight="400" fill="#64748b">Plain files on disk</text>
    
    <text x="582" y="243" font-size="12" font-weight="600" fill="#a7f3d0">✓ Git Versioned</text>
    <text x="594" y="258" font-size="10.5" font-weight="400" fill="#64748b">History &amp; review diffs</text>
    
    <text x="582" y="282" font-size="12" font-weight="600" fill="#a7f3d0">✓ Minimal Frontmatter</text>
    <text x="594" y="297" font-size="10.5" font-weight="400" fill="#64748b">Machine-verifiable keys</text>

    <text x="582" y="321" font-size="12" font-weight="600" fill="#a7f3d0">✓ Rich Prose Nuance</text>
    <text x="594" y="336" font-size="10.5" font-weight="400" fill="#64748b">Context for humans &amp; AI</text>
  </g>
</svg>
