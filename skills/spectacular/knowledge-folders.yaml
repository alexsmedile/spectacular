# Shared folder agreements for durable context. Diagnostics are opt-in.
# Profiles guide metadata choices; governed formats retain their validators.
version: '1.3'
metadata:
  required: [type, version, created, updated]
  recommended: [description]
  default_profile: compact
profiles:
  freeform:
    applies_to: unconstrained
    required: []
  minimal: {applies_to: maintained-context, required_from: metadata.required}
  compact:
    extends: minimal
    recommended_from: metadata.recommended
    optional: [title]
  extended:
    extends: compact
    optional: [tags, sources, status]
  governed: {applies_to: governed-records, schema_source: emitting-command, independent_of_context_scale: true}
unconstrained: [raw, sketch, scratchpad]
historical: [history]
navigation:
  manual: INDEX.md
  generated: index.json
  legacy: [index.md, catalog.md]
collections:
  anchors:
    location: root
    types: [Anchor]
    purpose: Current durable project truth; ONTOLOGY.md names the domain model.
  atlas:
    types: [Atlas, Entity, Concept, Map, Reference]
    purpose: Linked objects, relationships, lifecycles, and explanatory maps.
  plans:
    types: [Plan, Reference]
    purpose: Intended outcome, approach, progress, and verification.
  decisions:
    types: [Decision]
    purpose: Choice, rationale, and supersession; governed validation recommended.
  campaigns:
    types: [Campaign, MissionPlan, Reference]
    purpose: Optional roadmap spanning several plans or Missions.
  retrospectives:
    types: [Retrospective]
    purpose: Findings and lessons with independent lasting value.
  requirements:
    types: [Requirement, Reference]
    purpose: Optional linked needs, outcomes, constraints, and acceptance criteria; no Contract authority.
  specs:
    types: [Spec, Requirement, Interface, Reference]
    purpose: Optional reusable behavior and interface specifications; no Contract authority.
  audits:
    types: [Audit, Reference]
    purpose: Optional inspection scope, revision, findings, basis, and limitations.
governed:
  collections: [contracts, proposals, missions, evidence, gaps, handoffs, assessments, reviews, archive]
  purpose: Existing typed records retain mechanical validation and lifecycle rules.
