name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Download Modules
        run: go mod download

      - name: Run Full Verification Suite
        run: bash test/verify.sh all

      - name: Assemble Deterministic Release Archives
        run: |
          go run ./cmd/assemble-release --output dist --commit "${{ github.sha }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@c062e49d63c5a61117462002be966a337c731056 # v2.2.1
        with:
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
