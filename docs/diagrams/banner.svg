<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%" role="img" aria-label="Spectacular — See, Steer, and Ship AI Work" style="background:#0b0f17; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="55%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <filter id="bannerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <rect width="800" height="200" fill="url(#bannerBg)" />
  <ellipse cx="150" cy="86" rx="230" ry="120" fill="url(#glow)" />

  <!-- Mark: three governed stages — propose, decide, ship -->
  <g filter="url(#bannerShadow)">
    <rect x="56" y="62" width="30" height="30" rx="7" fill="#151022" stroke="#c084fc" stroke-width="1.6" />
    <circle cx="71" cy="77" r="4.5" fill="#c084fc" />

    <rect x="98" y="62" width="30" height="30" rx="7" fill="#0f172a" stroke="#38bdf8" stroke-width="1.6" />
    <path d="M 106 77 L 111 82 L 120 71" fill="none" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />

    <rect x="140" y="62" width="30" height="30" rx="7" fill="#0a1a16" stroke="#34d399" stroke-width="1.6" />
    <path d="M 148 77 L 162 77 M 156 71 L 162 77 L 156 83" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <path d="M 86 77 L 98 77" stroke="#94a3b8" stroke-width="1.4" stroke-opacity="0.55" />
  <path d="M 128 77 L 140 77" stroke="#94a3b8" stroke-width="1.4" stroke-opacity="0.55" />

  <text x="56" y="132" font-size="38" font-weight="700" letter-spacing="0.5" fill="url(#wordmark)">Spectacular</text>
  <text x="58" y="158" font-size="13" font-weight="400" letter-spacing="0.4" fill="#94a3b8">See, Steer, and Ship AI Work.</text>

  <rect x="56" y="172" width="420" height="2" rx="1" fill="url(#rule)" />

  <g transform="translate(596, 62)">
    <rect x="0" y="0" width="148" height="26" rx="13" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="17" cy="13" r="4" fill="#34d399" />
    <text x="30" y="17" font-size="11" font-weight="600" letter-spacing="0.3" fill="#cbd5e1">Agents build.</text>
  </g>
  <g transform="translate(596, 96)">
    <rect x="0" y="0" width="148" height="26" rx="13" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="17" cy="13" r="4" fill="#fbbf24" />
    <text x="30" y="17" font-size="11" font-weight="600" letter-spacing="0.3" fill="#cbd5e1">Humans decide.</text>
  </g>
</svg>
